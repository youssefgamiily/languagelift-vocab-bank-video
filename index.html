    <style>

        background: #000;

      #root {
        position: relative;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #F3F3F2;
      }
      .scene {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
      }
    </style>
  </head>

    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
      (function () {
        var tl = window.__timelines["main"];

        // 13.035s: Scene 1 -> Scene 2 crossfade
        tl.to("#el-01-forgetting-trap", { opacity: 0, duration: 0.5, ease: "power2.inOut" }, 13.035);
        tl.fromTo("#el-02-discover-capture", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.inOut" }, 13.035);

        // 29.231s: Scene 2 -> Scene 3 rack-focus blur zoom
        tl.to("#el-02-discover-capture", { filter: "blur(10px)", scale: 1.03, opacity: 0, duration: 0.6, ease: "power2.inOut" }, 29.231);
        tl.fromTo("#el-03-living-memory", { filter: "blur(10px)", scale: 0.97, opacity: 0 }, { filter: "blur(0px)", scale: 1, opacity: 1, duration: 0.6, ease: "power2.inOut" }, 29.231);

        // 45.845s: Scene 3 -> Scene 4 crossfade
        tl.to("#el-03-living-memory", { opacity: 0, duration: 0.5, ease: "power2.inOut" }, 45.845);
        tl.fromTo("#el-04-practice-everywhere", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.inOut" }, 45.845);

        // 61.832s: Scene 4 -> Scene 5 rack-focus blur zoom
        tl.to("#el-04-practice-everywhere", { filter: "blur(10px)", scale: 1.03, opacity: 0, duration: 0.6, ease: "power2.inOut" }, 61.832);
        tl.fromTo("#el-05-mastery-cta", { filter: "blur(10px)", scale: 0.97, opacity: 0 }, { filter: "blur(0px)", scale: 1, opacity: 1, duration: 0.6, ease: "power2.inOut" }, 61.832);

        // Full-span anchor to guarantee main timeline length
        tl.to({}, { duration: 72.620 }, 0);
      })();
    </script>
